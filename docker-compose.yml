services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureframe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: secureframe_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureframe"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  fastapi-analyzer:
    build:
      context: ./backend
    container_name: fastapi-analyzer
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - public
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp/sandbox:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    mem_limit: 512m
    cpus: "0.50"

volumes:
  pgdata:
  minio_data:

networks:
  internal:
    internal: true
  public:
    driver: bridge